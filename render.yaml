services:
  - type: web
    name: tarix
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: ADMIN_EMAIL
        value: uvaysiddin75@gmail.com
      - key: ADMIN_NAME
        value: Uvaysiddin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
