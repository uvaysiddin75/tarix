# Render free rejimida server uxlab qolmasligi uchun har 14 daqiqada ping
name: Keep Render Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render service
        run: |
          curl -sf --max-time 120 https://tarix-do6q.onrender.com/api/health || true
          curl -sf --max-time 120 https://tarix-do6q.onrender.com/api/auth/status || true
